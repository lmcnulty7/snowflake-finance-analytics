name: Finance Analytics
description: >
  SaaS finance analytics semantic model for ARR, MRR, subscription lifecycle,
  and revenue movement analysis across customers, subscriptions, and monthly revenue.

tables:
  - name: customers
    description: Customer master records with company profile, industry, and plan tier.
    base_table:
      database: FINANCE_ANALYTICS
      schema: CORE
      table: CUSTOMERS
    primary_key:
      columns:
        - customer_id
    dimensions:
      - name: customer_id
        description: Unique identifier for each customer.
        expr: CUSTOMER_ID
        data_type: number
        unique: true
      - name: company_name
        description: Legal or display name of the customer company.
        expr: COMPANY_NAME
        data_type: varchar
        synonyms:
          - account name
          - customer name
      - name: industry
        description: Industry vertical of the customer company.
        expr: INDUSTRY
        data_type: varchar
      - name: plan_tier
        description: Current subscription plan tier for the customer.
        expr: PLAN_TIER
        data_type: varchar
        synonyms:
          - plan
          - tier
          - subscription tier
    time_dimensions:
      - name: signup_date
        description: Date the customer signed up for the product.
        expr: SIGNUP_DATE
        data_type: date
        synonyms:
          - registration date
          - onboarding date

  - name: subscriptions
    description: >
      Subscription contracts linking customers to annual contract value and lifecycle status.
    base_table:
      database: FINANCE_ANALYTICS
      schema: CORE
      table: SUBSCRIPTIONS
    primary_key:
      columns:
        - subscription_id
    dimensions:
      - name: subscription_id
        description: Unique identifier for each subscription.
        expr: SUBSCRIPTION_ID
        data_type: number
        unique: true
      - name: customer_id
        description: Foreign key to the customer who owns this subscription.
        expr: CUSTOMER_ID
        data_type: number
      - name: status
        description: Subscription lifecycle status. Values are active or churned.
        expr: STATUS
        data_type: varchar
        is_enum: true
        sample_values:
          - active
          - churned
        synonyms:
          - subscription status
          - contract status
    time_dimensions:
      - name: start_date
        description: Date the subscription contract started.
        expr: START_DATE
        data_type: date
      - name: end_date
        description: Date the subscription contract ended, if applicable.
        expr: END_DATE
        data_type: date
    measures:
      - name: annual_contract_value
        description: Annual contract value (ACV) for the subscription in dollars.
        expr: ANNUAL_CONTRACT_VALUE
        data_type: number
        default_aggregation: sum
        synonyms:
          - ACV
          - contract value
          - ARR per subscription
    metrics:
      - name: total_arr
        description: Total annual recurring revenue from active subscriptions.
        expr: SUM(CASE WHEN status = 'active' THEN annual_contract_value ELSE 0 END)
        synonyms:
          - ARR
          - annual recurring revenue
          - total annual recurring revenue

  - name: monthly_revenue
    description: >
      Monthly recurring revenue by customer, including revenue movement type
      (new, renewal, expansion, contraction, churn).
    base_table:
      database: FINANCE_ANALYTICS
      schema: CORE
      table: MONTHLY_REVENUE
    primary_key:
      columns:
        - customer_id
        - revenue_month
    dimensions:
      - name: customer_id
        description: Foreign key to the customer associated with this revenue record.
        expr: CUSTOMER_ID
        data_type: number
      - name: revenue_type
        description: Category of revenue movement for the month.
        expr: REVENUE_TYPE
        data_type: varchar
        is_enum: true
        sample_values:
          - new
          - renewal
          - expansion
          - contraction
          - churn
        synonyms:
          - revenue movement
          - MRR movement type
    time_dimensions:
      - name: revenue_month
        description: Calendar month the revenue amount applies to.
        expr: REVENUE_MONTH
        data_type: date
        synonyms:
          - month
          - reporting month
    measures:
      - name: mrr
        description: Monthly recurring revenue amount in dollars.
        expr: MRR
        data_type: number
        default_aggregation: sum
        synonyms:
          - monthly recurring revenue
    metrics:
      - name: total_mrr
        description: Sum of MRR excluding zero values.
        expr: SUM(CASE WHEN mrr > 0 THEN mrr ELSE NULL END)
        synonyms:
          - MRR
          - total monthly recurring revenue
      - name: churned_customers
        description: Count of distinct customers with churn revenue type.
        expr: COUNT(DISTINCT CASE WHEN revenue_type = 'churn' THEN customer_id END)
        synonyms:
          - churn count
          - customers churned

relationships:
  - name: subscriptions_to_customers
    left_table: subscriptions
    right_table: customers
    relationship_columns:
      - left_column: customer_id
        right_column: customer_id
    join_type: left_outer
    relationship_type: many_to_one

  - name: monthly_revenue_to_customers
    left_table: monthly_revenue
    right_table: customers
    relationship_columns:
      - left_column: customer_id
        right_column: customer_id
    join_type: left_outer
    relationship_type: many_to_one

verified_queries:
  - name: total_mrr
    question: What is total MRR?
    sql: |
      SELECT SUM(mrr) AS total_mrr
      FROM __monthly_revenue
      WHERE mrr > 0
    use_as_onboarding_question: true

  - name: total_arr
    question: What is total ARR?
    sql: |
      SELECT SUM(annual_contract_value) AS total_arr
      FROM __subscriptions
      WHERE status = 'active'
    use_as_onboarding_question: true

  - name: churned_customer_count
    question: How many customers churned?
    sql: |
      SELECT COUNT(DISTINCT customer_id) AS churned_customers
      FROM __monthly_revenue
      WHERE revenue_type = 'churn'
    use_as_onboarding_question: true

  - name: mrr_by_month
    question: What is MRR by month?
    sql: |
      SELECT revenue_month, SUM(mrr) AS total_mrr
      FROM __monthly_revenue
      WHERE mrr > 0
      GROUP BY revenue_month
      ORDER BY revenue_month

custom_instructions: |
  ARR is the sum of annual_contract_value from subscriptions where status = 'active'.
  MRR totals exclude rows where mrr = 0.
  Churned customers are counted from monthly_revenue where revenue_type = 'churn'.
  Revenue type values are lowercase: new, renewal, expansion, contraction, churn.
  Subscription status values are lowercase: active, churned.
  Physical tables: FINANCE_ANALYTICS.CORE.CUSTOMERS, FINANCE_ANALYTICS.CORE.SUBSCRIPTIONS,
  FINANCE_ANALYTICS.CORE.MONTHLY_REVENUE.
